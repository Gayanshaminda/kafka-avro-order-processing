name: kafka-order-assignment

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  consumer:
    build: .
    environment: &app-environment
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MAX_RETRIES: 3
      RETRY_BACKOFF_SECONDS: 1
      TEMPORARY_FAILURES_BEFORE_SUCCESS: 2
    command: ["python", "-m", "src.consumer"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  dlq-monitor:
    build: .
    environment: *app-environment
    command: ["python", "-m", "src.dlq_consumer"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  producer:
    build: .
    environment: *app-environment
    command: ["python", "-m", "src.producer", "--demo", "--interval", "0.5"]
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_started
      dlq-monitor:
        condition: service_started
    restart: "no"

volumes:
  kafka-data:
